name: Offline evaluation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check fieldcheck tests fixtures/make_negative_controls.py
      - run: ruff format --check fieldcheck tests fixtures/make_negative_controls.py
      - run: mypy fieldcheck
      - run: python -m compileall -q fieldcheck tests fixtures
      - run: python -m unittest discover -s tests -v
      - run: python -m fieldcheck fixtures/baseline.jsonl --output report.json
      - name: Verify intentional controls fail with exit 1
        shell: bash
        run: |
          set +e
          python -m fieldcheck fixtures/negative-controls.jsonl
          result=$?
          test "$result" -eq 1
