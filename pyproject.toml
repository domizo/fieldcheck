[project]
name = "fieldcheck"
version = "0.1.0"
description = "A dependency-free offline evaluator for versioned AI workflow traces"
requires-python = ">=3.11"
dependencies = []

[tool.fieldcheck]
contract = "switchyard.run.v1"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
